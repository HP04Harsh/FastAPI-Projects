services:
  mongodb:
    image: mongo:7.0
    container_name: wakeel_mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:?Set this in .env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:?Set this in .env}
    volumes:
      - mongodb_data:/data/db

volumes:
  mongodb_data: